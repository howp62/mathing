<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>예시 카드 그림 샘플</title>
<style>
:root {
  --bg: #EFE8DA; --paper: #F7F2E8; --surface: #FFFDF8;
  --ink: #2A2522; --ink-2: #5A524B; --ink-3: #6F665D;
  --line: #E6DCCB; --line-2: #D8CCB7;
  --primary: #2F4D7A; --primary-2: #253E63; --primary-soft: #E3E9F3;
  --accent: #C8553D; --accent-soft: #F6E3D8; --accent-ink: #8A3B26;
  --hl: #FFE27A;
  --amber-soft: #F8EDD6; --amber-ink: #7A520B;
  --danger: #A8392F; --danger-soft: #F6E1DE;
  --star: #FFF3CF; --star-line: #E9C46A; --star-ink: #7A5A00;
  --q: #3F5F8F; --q-soft: #EDF1F8; --q-line: #D3DDEC;
  --shadow-sm: 0 1px 2px rgba(42, 37, 34, .06);
  --shadow: 0 1px 2px rgba(42, 37, 34, .05), 0 6px 20px rgba(42, 37, 34, .07);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --display: var(--font-display), "Noto Serif KR", "AppleMyungjo", serif;
  --math: "Times New Roman", "STIX Two Text", Georgia, serif;
}
.tag { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
.formula { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1px dashed var(--line-2); font-family: var(--math); font-size: 18px; font-style: italic; white-space: nowrap; overflow-x: auto; }
.mcard { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
.mcard .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.mcard .illus { height: 120px; border-radius: 12px; background: var(--paper); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.mcard .illus svg { width: 100%; height: 100%; }
.illus.wait .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
.illus.wait .pop { opacity: 0; }
.illus.play .draw { animation: illus-draw 1s ease-out var(--d, 0s) forwards; }
.illus.play .pop { animation: illus-pop .4s ease-out var(--d, .9s) forwards; }
@keyframes illus-draw { to { stroke-dashoffset: 0; } }
@keyframes illus-pop { to { opacity: 1; } }
}
.mcard h3 { margin: 0; font-size: 17px; line-height: 1.35; }
.mcard p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.mcard .formula { margin-top: auto; font-size: 16px; padding: 8px 12px; }
.concept { font-size: 12.5px; font-weight: 700; color: var(--accent-ink); }
.concept::before { content: "닮은 개념 · "; color: var(--ink-3); font-weight: 600; }
}
body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
main { max-width: 480px; margin: 0 auto; padding: 20px 20px 48px; }
h1 { font-size: 22px; margin: 4px 0 6px; } .lead { color: var(--ink-2); font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
button.replay { position: sticky; top: 10px; z-index: 2; display: block; width: 100%; padding: 12px; border-radius: 14px; border: 0; background: var(--primary); color: #fff; font-weight: 700; font-size: 15px; margin-bottom: 16px; }
figure { margin: 0 0 22px; } figcaption { font-size: 12.5px; font-weight: 700; color: var(--q); margin: 0 0 6px; }
.mcard .formula { font-family: "Times New Roman", serif; font-style: italic; background: var(--paper); border: 1.5px dashed var(--line-2); border-radius: 12px; }
</style></head><body><main>
<h1>예시 카드 새 그림 16장</h1>
<p class="lead">"장면 + 수학" 모양이에요. 장면(가방·침대, 울타리·강아지, 옷)은 그대로 있고, 카드가 화면에 보이면 <b>수학 부분의 선이 한 번 그려지고 식이 나타나요.</b> 휴대폰의 '동작 줄이기'가 켜져 있으면 움직이지 않고 다 그린 그림이 보여요. 이제 공통수학1 4단원 예시 카드 32장 모두에 그림이 있어요(다항식 8장은 원래 있던 그래프 그림).</p>
<button class="replay" type="button">움직임 다시 보기</button>
<figure><figcaption>1 · 방정식과 부등식 · 여행</figcaption><article class="mcard"><div class="tags"><span class="tag">여행</span></div><div class="illus wait"><svg viewBox="0 0 240 120"><path d="M36 38V31Q36 26 41 26H51Q56 26 56 31V38" fill="none" stroke="#2F4D7A" stroke-width="2.2"/><rect x="18" y="38" width="56" height="58" rx="8" fill="#fff" stroke="#2F4D7A" stroke-width="2.2"/><path d="M29 41V93M63 41V93" stroke="#D8CCB7" stroke-width="2"/><rect x="34" y="56" width="24" height="14" rx="3" fill="#EDE4D3" stroke="#C8553D" stroke-width="1.4"/><text x="46" y="66.5" font-size="9" font-weight="700" text-anchor="middle" fill="#C8553D" font-family="sans-serif">60만</text><g fill="#2F4D7A"><circle cx="28" cy="100" r="3.5"/><circle cx="64" cy="100" r="3.5"/></g><rect x="98" y="16" width="4" height="30" rx="1.5" fill="#2F4D7A"/><path d="M130 38V46" stroke="#2F4D7A" stroke-width="3" stroke-linecap="round"/><rect x="100" y="31" width="31" height="8" rx="2" fill="#fff" stroke="#2F4D7A" stroke-width="1.8"/><rect x="104" y="25.5" width="9" height="6" rx="2.5" fill="#EDE4D3" stroke="#2F4D7A" stroke-width="1.3"/><rect x="113" y="28" width="18" height="11" rx="2" fill="#E3E9F3" stroke="#2F4D7A" stroke-width="1.5"/><text x="122" y="23" font-size="11.5" text-anchor="middle" fill="#C8553D" font-family="serif" font-style="italic">x</text><rect x="138" y="16" width="4" height="30" rx="1.5" fill="#2F4D7A"/><path d="M170 38V46" stroke="#2F4D7A" stroke-width="3" stroke-linecap="round"/><rect x="140" y="31" width="31" height="8" rx="2" fill="#fff" stroke="#2F4D7A" stroke-width="1.8"/><rect x="144" y="25.5" width="9" height="6" rx="2.5" fill="#EDE4D3" stroke="#2F4D7A" stroke-width="1.3"/><rect x="153" y="28" width="18" height="11" rx="2" fill="#E3E9F3" stroke="#2F4D7A" stroke-width="1.5"/><text x="162" y="23" font-size="11.5" text-anchor="middle" fill="#C8553D" font-family="serif" font-style="italic">x</text><rect x="178" y="16" width="4" height="30" rx="1.5" fill="#2F4D7A"/><path d="M210 38V46" stroke="#2F4D7A" stroke-width="3" stroke-linecap="round"/><rect x="180" y="31" width="31" height="8" rx="2" fill="#fff" stroke="#2F4D7A" stroke-width="1.8"/><rect x="184" y="25.5" width="9" height="6" rx="2.5" fill="#EDE4D3" stroke="#2F4D7A" stroke-width="1.3"/><rect x="193" y="28" width="18" height="11" rx="2" fill="#E3E9F3" stroke="#2F4D7A" stroke-width="1.5"/><text x="202" y="23" font-size="11.5" text-anchor="middle" fill="#C8553D" font-family="serif" font-style="italic">x</text><text x="226" y="38" font-size="11" font-weight="700" text-anchor="middle" fill="#8A8178" font-family="sans-serif">3박</text><path d="M100 92H230" stroke="#D8CCB7" stroke-width="2" stroke-linecap="round"/><path d="M104 88V96M152 88V96M200 88V96" stroke="#8A8178" stroke-width="1.4"/><g font-size="10" fill="#8A8178" font-family="sans-serif" text-anchor="middle"><text x="104" y="109">0</text><text x="152" y="109">8</text><text x="200" y="109">16</text></g><text x="232" y="109" font-size="8.5" fill="#8A8178" font-family="sans-serif" text-anchor="end">만 원</text><path class="draw" pathLength="1" style="--d:.2s" d="M152 92H200" stroke="#C8553D" stroke-width="5" stroke-linecap="round"/><g class="pop" style="--d:1.1s" fill="#C8553D"><circle cx="152" cy="92" r="4.5"/><circle cx="200" cy="92" r="4.5"/></g><text class="pop" style="--d:1.3s" x="176" y="78" font-size="12.5" text-anchor="middle" fill="#C8553D" font-family="serif" font-style="italic">8 ≤ x ≤ 16</text></svg></div><h3>3박 여행, 숙소는 1박에 얼마까지?</h3><p>여행 예산 60만 원 중 교통비로 12만 원을 써요. 남은 돈으로 3박 숙소비를 내야 하고, 1박에 8만 원 이상인 곳을 원한다면 두 조건을 동시에 만족해야 해요. 이렇게 여러 조건을 한꺼번에 묶어 푸는 게 연립부등식이에요.</p><div class="formula">3x + 12 ≤ 60,  x ≥ 8  →  8 ≤ x ≤ 16 (만 원)</div><div class="concept">연립부등식</div></article></figure><figure><figcaption>2 · 방정식과 부등식 · 동물</figcaption><article class="mcard"><div class="tags"><span class="tag">동물</span></div><div class="illus wait"><svg viewBox="0 0 240 120"><rect x="20" y="20" width="120" height="80" fill="#EDE4D3"/><path class="draw" pathLength="1" style="--d:.1s" d="M20 20H140V100H20Z" fill="none" stroke="#2F4D7A" stroke-width="3" stroke-linejoin="round"/><g class="pop" style="--d:1s" fill="#2F4D7A"><rect x="16.5" y="16.5" width="7" height="7" rx="1.5"/><rect x="76.5" y="16.5" width="7" height="7" rx="1.5"/><rect x="136.5" y="16.5" width="7" height="7" rx="1.5"/><rect x="136.5" y="56.5" width="7" height="7" rx="1.5"/><rect x="136.5" y="96.5" width="7" height="7" rx="1.5"/><rect x="76.5" y="96.5" width="7" height="7" rx="1.5"/><rect x="16.5" y="96.5" width="7" height="7" rx="1.5"/><rect x="16.5" y="56.5" width="7" height="7" rx="1.5"/></g><g transform="translate(78 64)"><path d="M-16-3Q-23-10-20-15" fill="none" stroke="#D79A2B" stroke-width="3" stroke-linecap="round"/><g stroke="#D79A2B" stroke-width="3" stroke-linecap="round"><path d="M-11 4V13M-4 4V13M5 4V13M10 4V13"/></g><rect x="-16" y="-6" width="28" height="12" rx="6" fill="#D79A2B"/><circle cx="15" cy="-9" r="7" fill="#D79A2B"/><path d="M11-15Q8-8 12-5" fill="none" stroke="#2A2522" stroke-width="2.4" stroke-linecap="round" opacity=".7"/><circle cx="17" cy="-11" r="1.2" fill="#2A2522"/><circle cx="22" cy="-7.5" r="1.6" fill="#2A2522"/></g><g class="pop" style="--d:1.2s" font-size="11" font-weight="700" fill="#2A2522" font-family="sans-serif"><text x="80" y="115" text-anchor="middle">6 m</text><text x="145" y="64">4 m</text></g><g font-size="10" fill="#8A8178" font-family="sans-serif" text-anchor="middle"><text x="198" y="32">울타리 20 m</text><text x="198" y="48">넓이 24 m²</text></g><g font-size="12" fill="#C8553D" font-family="serif" font-style="italic" text-anchor="middle"><text class="pop" style="--d:1.5s" x="198" y="76">6 + 4 = 10</text><text class="pop" style="--d:1.8s" x="198" y="96">6 × 4 = 24</text></g></svg></div><h3>강아지 운동장, 가로·세로를 한 번에 찾기</h3><p>울타리 20m로 넓이가 24m²인 직사각형 운동장을 만들려고 해요. 가로와 세로는 더하면 10, 곱하면 24인 두 수예요. 이런 두 수는 이차방정식 t² − 10t + 24 = 0의 두 근이라서, 풀면 바로 4m와 6m가 나와요.</p><div class="formula">t² − (합)t + (곱) = 0  →  t² − 10t + 24 = 0  →  t = 4, 6</div><div class="concept">근과 계수의 관계</div></article></figure><figure><figcaption>3 · 방정식과 부등식 · 음악</figcaption><article class="mcard"><div class="tags"><span class="tag">음악</span></div><div class="illus wait"><svg viewBox="0 0 240 120"><rect x="14" y="6" width="62" height="108" rx="9" fill="#fff" stroke="#2F4D7A" stroke-width="2"/><rect x="20" y="16" width="50" height="86" rx="3" fill="#2F4D7A"/><rect x="23" y="74" width="4" height="20" rx="1" fill="#EDE4D3"/><rect x="29" y="60" width="4" height="34" rx="1" fill="#D79A2B"/><rect x="35" y="46" width="4" height="48" rx="1" fill="#EDE4D3"/><rect x="41" y="54" width="4" height="40" rx="1" fill="#EDE4D3"/><rect x="47" y="66" width="4" height="28" rx="1" fill="#D79A2B"/><rect x="53" y="42" width="4" height="52" rx="1" fill="#EDE4D3"/><rect x="59" y="64" width="4" height="30" rx="1" fill="#EDE4D3"/><rect x="65" y="78" width="4" height="16" rx="1" fill="#D79A2B"/><path d="M106 96H212M120 112V18" stroke="#D8CCB7" stroke-width="1.6"/><text x="214" y="108" font-size="8.5" fill="#8A8178" text-anchor="end" font-family="sans-serif">실수</text><text x="125" y="24" font-size="8.5" fill="#8A8178" text-anchor="start" font-family="sans-serif">허수</text><path class="draw" pathLength="1" style="--d:0.20s" d="M120 96L190 44" fill="none" stroke="#C8553D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path class="draw" pathLength="1" style="--d:0.90s" d="M138 96A18 18 0 0 0 134.4 85.3" fill="none" stroke="#8A8178" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle class="pop" style="--d:1s" cx="190" cy="44" r="4" fill="#C8553D"/><path class="pop" style="--d:1.2s" d="M190 44V96M190 44H120" fill="none" stroke="#8A8178" stroke-width="1.2" stroke-dasharray="3 3"/><text class="pop" style="--d:1.30s" x="190" y="108" font-size="12.5" fill="#C8553D" text-anchor="middle" font-family="serif" font-style="italic">a</text><text class="pop" style="--d:1.30s" x="112" y="48" font-size="12.5" fill="#C8553D" text-anchor="middle" font-family="serif" font-style="italic">b</text><text class="pop" style="--d:1.50s" x="236" y="30" font-size="13" fill="#C8553D" text-anchor="end" font-family="serif" font-style="italic">z = a + bi</text><text class="pop" style="--d:1.40s" x="148" y="64" font-size="8.5" fill="#8A8178" text-anchor="end" font-family="sans-serif">크기</text><text class="pop" style="--d:1.40s" x="142" y="92" font-size="8" fill="#8A8178" text-anchor="start" font-family="sans-serif">위치</text></svg></div><h3>음악 앱의 출렁이는 막대 속 복소수</h3><p>음악 앱이나 녹음 프로그램에서 막대가 출렁이는 화면(스펙트럼)은 소리를 낮은음부터 높은음까지 나눠 보여 줘요. 소리를 높낮이별로 나누는 이 계산에 복소수가 쓰여요. 복소수 a + bi 하나에 그 높이 소리의 크기와 파동이 시작하는 위치를 함께 담을 수 있거든요.</p><div class="formula">i² = −1,  z = a + bi</div><div class="concept">복소수</div></article></figure><figure><figcaption>4 · 방정식과 부등식 · 스포츠</figcaption><article class="mcard"><div class="tags"><span class="tag">스포츠</span></div><div class="illus wait"><svg viewBox="0 0 240 120"><rect x="0" y="104" width="240" height="16" fill="#E3E9F3"/><path d="M0 104q10-4 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#2F4D7A" stroke-width="1.4"/><rect x="14" y="26" width="22" height="78" fill="#EDE4D3" stroke="#2F4D7A" stroke-width="1.6"/><path d="M10 26H46" stroke="#2F4D7A" stroke-width="3" stroke-linecap="round"/><text x="25" y="70" font-size="8.5" fill="#2F4D7A" text-anchor="middle" font-weight="700" font-family="sans-serif">10 m</text><circle cx="40" cy="12" r="3.5" fill="#2F4D7A"/><path d="M40 16V22M40 18L35.5 13.5M40 18L44.5 13.5M40 22L38 25M40 22L42 25" fill="none" stroke="#2F4D7A" stroke-width="1.6" stroke-linecap="round"/><path class="draw" pathLength="1" style="--d:0.20s" d="M40 24Q110 -16 180 104" fill="none" stroke="#C8553D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path class="pop" style="--d:1.1s" d="M172 100l-6-7M180 98v-9M188 100l6-7" fill="none" stroke="#2F4D7A" stroke-width="1.6" stroke-linecap="round"/><text class="pop" style="--d:1.30s" x="196" y="92" font-size="12.5" fill="#C8553D" text-anchor="start" font-family="serif" font-style="italic">t = 2초</text><text class="pop" style="--d:1.50s" x="234" y="22" font-size="11" fill="#C8553D" text-anchor="end" font-weight="700" font-family="sans-serif">−5t² + 5t + 10 = 0</text></svg></div><h3>10m 다이빙, 물에 닿기까지 몇 초?</h3><p>공기 저항을 빼고 생각하면, 위로 살짝 뛰었다 떨어지는 선수의 높이는 시간에 대한 이차식으로 쓸 수 있어요. 높이가 0이 되는 때를 구하면 물에 닿는 시간이 나와요. 이때 나오는 음수 답은 시간이 될 수 없으니 버려요.</p><div class="formula">−5t² + 5t + 10 = 0  →  (t − 2)(t + 1) = 0  →  t = 2</div><div class="concept">방정식 세워서 풀기</div></article></figure><figure><figcaption>5 · 방정식과 부등식 · 건강·의학</figcaption><article class="mcard"><div class="tags"><span class="tag">건강·의학</span></div><div class="illus wait"><svg viewBox="0 0 240 120"><g transform="rotate(-30 32 32)"><rect x="14" y="25" width="36" height="14" rx="7" fill="#fff" stroke="#2F4D7A" stroke-width="1.6"/><path d="M32 25H21a7 7 0 0 0 0 14H32Z" fill="#C8553D" stroke="#2F4D7A" stroke-width="1.6"/></g><text x="76" y="16" font-size="8.5" fill="#8A8178" text-anchor="start" font-family="sans-serif">피 속 약 농도</text><path d="M66 104H226M70 108V16" stroke="#D8CCB7" stroke-width="1.6"/><path d="M66 59H226" stroke="#8A8178" stroke-width="1.2" stroke-dasharray="4 3"/><text x="63" y="62" font-size="9" fill="#8A8178" text-anchor="end" font-family="sans-serif">5</text><text x="226" y="54" font-size="8.5" fill="#8A8178" text-anchor="end" font-family="sans-serif">효과 기준</text><path class="draw" pathLength="1" style="--d:0.10s" d="M70 104Q142 -58 214 104" fill="none" stroke="#2F4D7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path class="draw" pathLength="1" style="--d:1.00s" d="M94 59Q142 -13 190 59" fill="none" stroke="#C8553D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path class="pop" style="--d:1.4s" d="M94 59V104M190 59V104" stroke="#C8553D" stroke-width="1" stroke-dasharray="3 3"/><path class="draw" pathLength="1" style="--d:1.40s" d="M94 104H190" fill="none" stroke="#C8553D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="pop" style="--d:1.60s" x="94" y="116" font-size="9.5" fill="#8A8178" text-anchor="middle" font-family="sans-serif">1</text><text class="pop" style="--d:1.60s" x="190" y="116" font-size="9.5" fill="#8A8178" text-anchor="middle" font-family="sans-serif">5</text><text class="pop" style="--d:1.80s" x="142" y="90" font-size="12.5" fill="#C8553D" text-anchor="middle" font-family="serif" font-style="italic">1 ≤ t ≤ 5</text><text x="234" y="116" font-size="8.5" fill="#8A8178" text-anchor="end" font-family="sans-serif">시간</text></svg></div><h3>약이 효과를 내는 시간은 언제부터 언제까지?</h3><p>많은 약은 피 속 농도가 어느 기준보다 높아야 효과가 나요. 농도 변화를 C(t) = −t² + 6t처럼 단순한 곡선으로 놓으면, 농도가 5 이상인 시간은 이차부등식을 풀어 구할 수 있어요. 실제 농도 곡선은 이보다 복잡하지만, 효과가 이어지는 시간을 따지는 생각은 같아요.</p><div class="formula">−t² + 6t ≥ 5  →  (t − 1)(t − 5) ≤ 0  →  1 ≤ t ≤ 5</div><div class="concept">이차부등식</div></article></figure><figure><figcaption>6 · 경우의 수 · 패션·뷰티</figcaption><article class="mcard"><div class="tags"><span class="tag">패션·뷰티</span></div><div class="illus wait"><svg viewBox="0 0 240 120"><g stroke="#2F4D7A" stroke-width="1.3" stroke-opacity=".55" fill="none"><path class="draw" pathLength="1" style="--d:0.00s" d="M43 20L92 30"/><path class="draw" pathLength="1" style="--d:0.07s" d="M43 20L92 58"/><path class="draw" pathLength="1" style="--d:0.14s" d="M43 20L92 86"/><path class="draw" pathLength="1" style="--d:0.21s" d="M43 45L92 30"/><path class="draw" pathLength="1" style="--d:0.28s" d="M43 45L92 58"/><path class="draw" pathLength="1" style="--d:0.35s" d="M43 45L92 86"/><path class="draw" pathLength="1" style="--d:0.42s" d="M43 70L92 30"/><path class="draw" pathLength="1" style="--d:0.49s" d="M43 70L92 58"/><path class="draw" pathLength="1" style="--d:0.56s" d="M43 70L92 86"/><path class="draw" pathLength="1" style="--d:0.63s" d="M43 95L92 30"/><path class="draw" pathLength="1" style="--d:0.70s" d="M43 95L92 58"/><path <script>
const boxes = [...document.querySelectorAll('.illus')];
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('play'); io.unobserve(e.target); } }), { threshold: 0.6 });
boxes.forEach((b) => io.observe(b));
document.querySelector('.replay').onclick = () => boxes.forEach((b) => { b.classList.remove('play'); void b.offsetWidth; b.classList.add('play'); });
</script></body></html>
