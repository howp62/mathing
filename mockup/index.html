<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mathing 목업 v0.1</title>
<style>
:root{
  --bg:#EFEBE3;--paper:#FBF9F5;--surface:#FFFFFF;
  --ink:#1D2129;--ink-2:#4F5560;--ink-3:#868B94;
  --line:#E4DED3;--line-2:#D6CFC2;
  --primary:#2D6A5C;--primary-2:#22564A;--primary-soft:#E1EDE9;
  --accent:#DD7448;--accent-soft:#FBE7DC;
  --amber:#D79A2B;--amber-soft:#F8EDD6;
  --danger:#B8433A;--danger-soft:#F6E1DE;
  --q:#6650D4;
  --shadow-sm:0 1px 2px rgba(29,33,41,.06);
  --shadow:0 1px 2px rgba(29,33,41,.05),0 6px 20px rgba(29,33,41,.07);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --math:"Times New Roman","STIX Two Text",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--q);outline-offset:2px}

/* 목업 상단 막대 */
.proto{position:sticky;top:0;z-index:50;background:rgba(251,249,245,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.proto-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.proto-brand{display:flex;align-items:center;gap:8px;font-weight:800}
.proto-brand svg{width:24px;height:24px}
.proto-brand small{font-weight:500;color:var(--ink-3);font-size:13px}
.proto-ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff}
.pbtn{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}

/* 무대 */
.stage{max-width:1200px;margin:0 auto;padding:24px 16px 60px;display:flex;gap:32px;justify-content:center;align-items:flex-start}
.note{width:300px;flex:none;position:sticky;top:84px}
.note h3{margin:0 0 6px;font-size:15px}
.note p,.note li{font-size:13.5px;color:var(--ink-2);margin:0 0 8px}
.note ul{padding-left:18px;margin:0}
.note .tagline{display:inline-block;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:3px 8px;border-radius:999px;margin-bottom:8px}
@media (max-width:860px){.stage{flex-direction:column;align-items:center}.note{position:static;width:100%;max-width:390px}}

/* 휴대폰 */
.phone{width:390px;max-width:100%;height:780px;background:var(--paper);border:10px solid #1D2129;border-radius:44px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;flex:none}
@media (max-width:430px){.phone{height:calc(100vh - 140px);min-height:620px;border-width:6px;border-radius:30px}}
.sbar{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:700}
.screen{flex:1;overflow-y:auto;padding:4px 20px 24px;position:relative}
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button{flex:1;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--primary)}

/* 공통 */
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:18px}
.logo svg{width:24px;height:24px}
.top{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:6px}
.top .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-left:-8px;font-size:20px;color:var(--ink-2)}
.top .ttl{font-weight:700;font-size:15px}
.top .right{margin-left:auto}
h1{font-size:23px;line-height:1.35;letter-spacing:-.02em;margin:8px 0 6px}
h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--ink-2);font-size:14.5px;margin:0 0 16px}
.muted{color:var(--ink-3);font-size:13px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;font-size:16px;text-align:center}
.btn:hover{background:var(--primary-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:var(--danger)}
.btn+.btn{margin-top:10px}
.link{color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:15px}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}
.field small{display:block;color:var(--ink-3);font-size:12px;margin-top:5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--primary)}
.msg{padding:10px 12px;border-radius:12px;font-size:13.5px;margin:10px 0}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--primary-soft);color:var(--primary-2)}
.msg.warn{background:var(--amber-soft);color:#8a5a0c}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-sm)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.sm{padding:4px 10px;font-size:12px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:#9A4420;font-size:12px;font-weight:700}
.tag.g{background:var(--primary-soft);color:var(--primary-2)}
.formula{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px dashed var(--line-2);font-family:var(--math);font-size:19px;font-style:italic;white-space:nowrap;overflow-x:auto}
.progress{display:flex;gap:4px;margin:4px 0 14px}
.progress i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.progress i.on{background:var(--primary)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 6px}
.scale button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:20px;font-weight:800;color:var(--ink-2)}
.scale button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.scale-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.foot{position:sticky;bottom:-24px;margin:20px -20px -24px;padding:12px 20px 16px;background:linear-gradient(to top,var(--paper) 75%,rgba(251,249,245,0))}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;z-index:20;box-shadow:var(--shadow)}

/* 첫 화면 */
.hero{text-align:center;padding:60px 0 20px}
.biglogo{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.biglogo svg{width:44px;height:44px}
.hero .name{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero .slogan{color:var(--ink-2);margin:2px 0 26px}
.hero ol{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 34px;font-size:14px;color:var(--ink-2);margin:0 0 24px}
.hero ol li{margin:3px 0}

/* 복구 코드 */
.code{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:800;letter-spacing:.08em;text-align:center;padding:22px 10px;border:2px dashed var(--primary);border-radius:16px;background:var(--primary-soft);color:var(--primary-2);margin:16px 0}

/* 단원 목록 */
.subj{margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:.02em}
.unit{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.unit b{font-size:15px}
.unit .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-3)}
.unit.done .st{color:var(--primary)}
.unit.locked{background:transparent;border-style:dashed;color:var(--ink-3)}
.unit.locked b{font-weight:600}
.unit .dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);flex:none}
.unit.done .dot{background:var(--primary)}
.unit.open .dot{background:var(--accent)}

/* 카드 넘기기 */
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 12px}
.deck .card{flex:0 0 86%;scroll-snap-align:center}
.deck .card h3{margin:8px 0 6px;font-size:16px;line-height:1.4}
.deck .card p{margin:0;font-size:14px;color:var(--ink-2)}
.deck .card .cpt{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.think{min-height:170px;display:flex;flex-direction:column;justify-content:center;font-size:18px;font-weight:700;line-height:1.5;background:#F1EEFC;border-color:#DDD6F7}
.think small{display:block;color:var(--q);font-size:12px;font-weight:800;margin-bottom:8px}

/* 쓰기 */
.stepq{margin:18px 0 6px}
.stepq .lbl{font-size:12px;font-weight:800;color:var(--primary)}
.stepq .q{font-size:16px;font-weight:700;margin-top:2px}
.stepq .s{font-size:13px;color:var(--ink-3)}
.modes{display:flex;gap:6px;margin:4px 0 6px}

/* 미리보기 / 글 */
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;margin-bottom:12px}
.post.rec{border-color:#E9C46A;background:#FFFCF3}
.post .head{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.post .rows{display:grid;gap:6px}
.post .row{font-size:14px;line-height:1.55}
.post .row i{font-style:normal;font-size:11px;font-weight:800;color:var(--ink-3);display:block}
.post .acts{display:flex;align-items:center;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.like{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:700;color:var(--ink-2)}
.like.on{background:var(--accent-soft);border-color:var(--accent);color:#9A4420}
.more{margin-left:auto;width:34px;height:34px;border-radius:50%;color:var(--ink-3);font-size:18px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.pill.star{background:#FFF3CF;border-color:#E9C46A;color:#7A5A00}
.pill.mine{background:var(--primary-soft);border-color:transparent;color:var(--primary-2)}
.pill.hide{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.switch{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:12px 0}
.switch .t{flex:1;font-size:14px}
.switch .t b{display:block;font-size:15px}
.tg{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;flex:none;cursor:pointer;margin:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg:checked{background:var(--primary)}
.tg:checked::after{transform:translateX(18px)}

/* 아래에서 올라오는 창 */
.sheet-bg{position:absolute;inset:0;background:rgba(29,33,41,.35);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 20px 22px}
.sheet h3{margin:0 0 4px}
.sheet .opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:8px;font-weight:600}

/* 노트 */
.nitem{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.nitem .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nitem .h b{font-size:16px}
.rel{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.rel .up{color:var(--primary)}
.vtabs{display:flex;gap:6px;margin:10px 0 8px}
.nacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mini{padding:7px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mini.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.nudge{background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#7a520b;margin-bottom:12px}

/* 연결 지도 */
.map{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}
.map h3{margin:0 0 2px;font-size:15px}
.map svg{width:100%;height:auto;display:block;margin-top:6px}
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.grid16 .t{border-radius:10px;padding:8px 6px;min-height:58px;font-size:11px;line-height:1.3;border:1px dashed var(--line-2);color:var(--ink-3)}
.grid16 .t.d{border:0;background:var(--primary);color:#fff}
.grid16 .t.d em{display:block;font-style:normal;font-size:10.5px;opacity:.85;margin-top:3px}
.grid16 .s{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--ink-3);margin-top:4px}

/* 운영자 화면 */
.admin{width:100%;max-width:880px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.admin .bar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.admin .bar .logo{font-size:16px}
.admin .body{padding:18px 20px 24px}
.admin table{width:100%;border-collapse:collapse;font-size:14px}
.admin th,.admin td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.admin th{font-size:12px;color:var(--ink-3)}
.admin td .txt{max-width:360px;color:var(--ink-2);font-size:13.5px}
.admin .btns{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.kpis div{flex:1;min-width:140px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink-3)}
.kpis b{display:block;font-size:20px;color:var(--ink)}
</style>
</head>
<body>
<header class="proto">
  <div class="proto-in">
    <div class="proto-brand"><span id="brandLogo"></span>mathing 목업 <small>v0.1 · 가짜 데이터로만 움직여요</small></div>
    <div class="proto-ctl">
      <div class="seg" role="group" aria-label="보기">
        <button data-view="student" class="on">학생 휴대폰</button>
        <button data-view="admin">운영자 화면</button>
      </div>
      <div class="seg" role="group" aria-label="학생 상태">
        <button data-who="new" class="on">처음 온 학생</button>
        <button data-who="back">다시 온 학생</button>
      </div>
      <button class="pbtn" data-reset>처음부터</button>
    </div>
  </div>
</header>

<main class="stage" id="stage"></main>

<script>
const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 25C9 6 23 27 26 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="6" cy="25" r="3.6" fill="#DD7448"/><circle cx="26" cy="7" r="3.6" fill="#2D6A5C"/></svg>`;
const HEART = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 7.9 3 4.5 6.5 4.5c2.2 0 3.6 1.2 4.5 2.6.9-1.4 2.3-2.6 4.5-2.6 3.5 0 5.6 3.4 4.1 6.8-2.1 4.6-9.6 9.2-9.6 9.2z" fill="currentColor"/></svg>`;
const IC = {
  units:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>`,
  note:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>`,
  me:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,
};
document.getElementById('brandLogo').innerHTML = LOGO;

const INTERESTS = ['게임','음악','스포츠','패션·뷰티','요리','영상·SNS','그림·디자인','동물','여행','자동차','건강·의학','환경','컴퓨터·AI','건축','공연·아이돌'];
const UNITS = [
  {s:'공통수학1', u:[['다항식',1],['방정식과 부등식',1],['경우의 수',1],['행렬',1]]},
  {s:'공통수학2', u:[['도형의 방정식',0],['집합과 명제',0],['함수와 그래프',0]]},
  {s:'대수', u:[['지수함수와 로그함수',0],['삼각함수',0],['수열',0]]},
  {s:'미적분I', u:[['함수의 극한과 연속',0],['미분',0],['적분',0]]},
  {s:'확률과 통계', u:[['경우의 수',0],['확률',0],['통계',0]]},
];
const SET = {
  unit:'다항식', subject:'공통수학1',
  concepts:['다항식의 덧셈·뺄셈','다항식의 곱셈(전개)','다항식의 나눗셈','나머지정리','인수분해','식에 값 넣기'],
  think:[
    '네 관심 분야에서, 크기가 아직 정해지지 않은 것을 식으로 미리 계산해두는 장면이 있을까?',
    '어떤 값이 커질수록 결과가 점점 더 빨리 커지는 걸 본 적 있어? 레벨, 조회수, 크기 같은 것들.',
    '무언가를 나눠서 남는 것으로 확인하거나 검사하는 장면이 있을까?',
    '곡선을 매끄럽게 그리거나, 휘어지는 정도를 예측해야 하는 일이 있을까?'],

function bad(text){
  if (/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/.test(text)) return '전화번호처럼 보이는 부분이 있어요. 지우고 다시 저장해 줘.';
  if (/[\w.+-]+@[\w-]+\.[\w.]+/.test(text)) return '이메일 주소처럼 보이는 부분이 있어요.';
  if (/https?:\/\/|www\./i.test(text)) return '인터넷 주소는 넣을 수 없어요.';
  if (/(^|\s)@[A-Za-z0-9_.]{3,}/.test(text)) return 'SNS 아이디처럼 보이는 부분이 있어요.';
  if (/(바보|멍청|ㅅㅂ|시발|병신|ㅂㅅ)/.test(text)) return '고운 말이 아닌 표현이 있어요. 바꿔서 저장해 줘.';
  return '';
}
function toast(t){ S.toast=t; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast='';render();},1800); }
function sortedPosts(){
  const mine = S.posts.filter(p=>p.mine), rest = S.posts.filter(p=>!p.mine);
  const score = p => (p.rec?0:S.interests.includes(p.tag)?1:2);
  let list = [...mine, ...rest.sort((a,b)=>score(a)-score(b))];
  if (S.filter!=='전체') list = list.filter(p=>p.tag===S.filter);
  return list;
}

function mapView(){
  const done = S.notes;
  const empty = done.length ? '' : '<p class="muted" style="margin:6px 0 0">아직 비어 있어. 단원을 하나 쓰면 여기에 첫 연결이 생겨. ("다시 온 학생"으로 바꾸면 채워진 모습을 볼 수 있어)</p>';
  if (S.map==='A'){
    // 지도 A: 단원을 지나는 길 위에 내가 연결한 관심사가 매달린 모양
    const all = UNITS.flatMap(g=>g.u.map(([u])=>({s:g.s,u})));
    const W=330, step=W/(all.length+1);
    const pts = all.map((x,i)=>({...x,x:step*(i+1),y:70+Math.sin(i*0.9)*18,d:done.find(n=>n.unit===x.u&&x.s===n.subject)}));
    const path = pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    return `<div class="map"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0">연결 지도</h3><span class="seg" style="margin-left:auto;padding:2px"><button class="${S.map==='A'?'on':''}" data-map="A" style="padding:4px 10px;font-size:12px">길</button><button class="${S.map==='B'?'on':''}" data-map="B" style="padding:4px 10px;font-size:12px">판</button></span></div><p class="muted" style="margin:0">지나온 단원과 이어 본 관심사. 점수는 없어.</p>${empty}
    <svg viewBox="0 0 ${W} 150" role="img" aria-label="연결 지도"><path d="${path}" fill="none" stroke="#D6CFC2" stroke-width="2" stroke-dasharray="4 4"/>
    ${pts.map(p=>p.d?`<line x1="${p.x}" y1="${p.y}" x2="${p.x}" y2="${p.y-38}" stroke="#DD7448" stroke-width="1.5"/><rect x="${p.x-26}" y="${p.y-56}" width="52" height="20" rx="10" fill="#FBE7DC"/><text x="${p.x}" y="${p.y-42}" text-anchor="middle" font-size="10" font-weight="700" fill="#9A4420">${p.d.tag}</text><circle cx="${p.x}" cy="${p.y}" r="7" fill="#2D6A5C"/><text x="${p.x}" y="${p.y+22}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D2129">${p.u}</text>`:`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#D6CFC2"/>`).join('')}
    </svg></div>`;
  }
  // 지도 B: 16칸 단원 판, 쓴 칸에 관심사
  return `<div class="map"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0">연결 지도</h3><span class="seg" style="margin-left:auto;padding:2px"><button class="${S.map==='A'?'on':''}" data-map="A" style="padding:4px 10px;font-size:12px">길</button><button class="${S.map==='B'?'on':''}" data-map="B" style="padding:4px 10px;font-size:12px">판</button></span></div><p class="muted" style="margin:0">16개 단원 중 이어 본 칸. 빈칸은 앞으로 만날 단원이야.</p>${empty}
  <div class="grid16">${UNITS.map(g=>`<div class="s">${g.s}</div>${g.u.map(([u])=>{const d=done.find(n=>n.unit===u&&n.subject===g.s);return `<div class="t ${d?'d':''}">${u}${d?`<em>${d.tag}</em>`:''}</div>`;}).join('')}`).join('')}</div></div>`;
}

  const tabbed = ['home','notes','me'].includes(S.scr) || S.scr==='gallery';
  const tabOn = S.scr==='notes'?'notes':S.scr==='me'?'me':'units';
  return `<div class="phone"><div class="sbar"><span>8:42</span><span>●●●</span></div>
  <div class="screen" id="screen">${SCR[S.scr]()}</div>
  ${tabbed?`<nav class="tabs"><button class="${tabOn==='units'?'on':''}" data-go="home">${IC.units}단원</button><button class="${tabOn==='notes'?'on':''}" data-go="notes">${IC.note}내 노트</button><button class="${tabOn==='me'?'on':''}" data-go="me">${IC.me}내 정보</button></nav>`:''}
  ${S.sheet?sheetHTML():''}${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}</div>`;
}
function sheetHTML(){
  if (S.sheet==='logout') return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" data-stop><h3>로그아웃할까?</h3><p class="muted">이 기기에 잠깐 보관하던 쓰던 글도 지워져.</p><button class="btn" data-act="logout">로그아웃</button><button class="btn ghost" data-act="closeSheet">취소</button></div></div>`;
  return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" data-stop><h3>어떤 문제가 있어?</h3><p class="muted">신고는 이름 없이 운영자에게 가. 한 글에 한 번만 할 수 있어.</p>
    ${['욕설·놀림','개인정보(이름, 학교, 연락처)','장난·관계없는 글','기타'].map(r=>`<button class="opt" data-reason="${r}">${r}</button>`).join('')}<button class="btn ghost" style="margin-top:12px" data-act="closeSheet">취소</button></div></div>`;
}
function noteHTML(){
  const [t,d,li] = NOTE[S.scr] || ['',''];
  return `<aside class="note"><span class="tagline">이 화면</span><h3>${t}</h3><p>${d}</p><ul>${(li||[]).map(x=>`<li>${x}</li>`).join('')}</ul></aside>`;
}

/* ---------- 운영자 화면 ---------- */
function adminHTML(){
  const R = S.admin;
  const reportRows = R.filter(r=>Object.keys(r.reasons).length).sort((a,b)=>b.hidden-a.hidden);
  return `<div class="admin"><div class="bar"><span class="logo">${LOGO}mathing 운영자</span>
    <div class="seg" style="margin-left:auto"><button class="${S.adminTab==='reports'?'on':''}" data-atab="reports">신고함 ${reportRows.length}</button><button class="${S.adminTab==='rec'?'on':''}" data-atab="rec">추천 연결</button></div></div>
  <div class="body">
  ${S.adminTab==='reports'?`<p class="muted" style="margin-top:0">자동으로 숨겨진 글(신고 3건 이상)이 맨 위에 와요. 운영자는 별명을 볼 수 있지만 비밀번호·복구 코드는 볼 수 없어요.</p>
    <table><thead><tr><th>글</th><th>신고 이유</th><th>상태</th><th>처리</th></tr></thead><tbody>
    ${reportRows.map(r=>`<tr><td><div class="muted">${r.unit} · <span class="tag" style="font-size:11px">${r.tag}</span> · 별명 ${esc(r.nick)}</div><div class="txt">${esc(r.txt)}</div></td>
      <td>${Object.entries(r.reasons).map(([k,v])=>`<div style="font-size:13px">${k} ${v}</div>`).join('')}</td>
      <td>${r.blocked?'<span class="pill hide">계정 막힘</span>':r.hidden?'<span class="pill hide">숨김</span>':'<span class="pill">보이는 중</span>'}</td>
      <td><div class="btns">${r.hidden?`<button class="mini" data-ad="show" data-id="${r.id}">되살리기</button>`:`<button class="mini" data-ad="hide" data-id="${r.id}">숨기기</button>`}<button class="mini" data-ad="block" data-id="${r.id}" ${r.blocked?'disabled':''}>계정 막기</button></div></td></tr>`).join('')}
    </tbody></table>`
  :`<div class="kpis"><div><b>128</b>가입한 학생</div><div><b>311</b>저장된 연결</div><div><b>2.6 → 3.4</b>관련성 평균 (전 → 후)</div></div>
    <p class="muted" style="margin-top:0">↑ 이 합계 칸은 PRD 열린 질문 1번이에요. 넣을지 정해 주세요. 아래는 ★를 달면 그 단원 갤러리 맨 위에 "추천 연결"로 보여요.</p>
    <table><thead><tr><th>글</th><th>추천</th></tr></thead><tbody>
    ${POSTS0.slice(0,5).map(p=>`<tr><td><div class="muted">다항식 · <span class="tag" style="font-size:11px">${p.tag}</span></div><div class="txt">${esc(p.a.join(' / '))}</div></td><td><button class="mini ${S.posts.find(x=>x.id===p.id).rec?'pri':''}" data-star="${p.id}">${S.posts.find(x=>x.id===p.id).rec?'★ 추천 중':'☆ 추천'}</button></td></tr>`).join('')}
    </tbody></table>`}
  </div></div>`;
}

/* ---------- 그리기 ---------- */
function render(){
  const st = document.getElementById('stage');
  const sc = document.getElementById('screen'); const y = sc ? sc.scrollTop : 0;
  st.innerHTML = S.view==='admin' ? adminHTML() : studentHTML() + noteHTML();
  const ns = document.getElementById('screen'); if (ns && render.keep) ns.scrollTop = y;
  render.keep = false;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  document.querySelectorAll('[data-who]').forEach(b=>b.classList.toggle('on',b.dataset.who===S.who));
  }
function go(scr){ if (scr==='privacy') S.prev=S.scr; S.scr=scr; S.err=''; S.sheet=null; render(); const sc=document.getElementById('screen'); if(sc) sc.scrollTop=0; }

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-act],.sheet-bg'); if (!t) return;
  if (e.target.closest('[data-stop]') && t.classList.contains('sheet-bg')) return;
  const d = t.dataset;
  if (d.view){ S.view=d.view; render(); return; }
  if (d.who){ const v=S.view, m=S.map; fresh(d.who); S.view=v; S.map=m; render(); return; }
  if (d.map){ S.map=d.map; render.keep=true; render(); return; }
  if ('reset' in d){ const v=S.view,m=S.map; fresh(S.who); S.view=v; S.map=m; render(); return; }
  if (d.go){ go(d.go); return; }
  if (d.unit){
    if (d.open!=='1') return toast('준비 중인 단원이에요');
    const done = S.notes.find(n=>n.unit===d.unit && n.subject===d.subj);
    if (done) return go('notes');
    if (d.unit!=='다항식') return toast('목업에서는 다항식만 끝까지 볼 수 있어요');
    S.pre=0;S.post=0;S.thinkI=0;S.ans=['','',''];S.free='';S.concepts=[];S.share=true;S.editProfile=false;S.rewriteI=null;
    return go('pre');
  }
  if (d.scale){ S[d.scale]=+d.n; render.keep=true; render(); return; }
  if (d.int){ const i=S.interests.indexOf(d.int); i<0?S.interests.push(d.int):S.interests.splice(i,1); render.keep=true; render(); return; }
  if (d.mode){ S.mode=d.mode; render.keep=true; render(); return; }
  if (d.cpt){ const i=S.concepts.indexOf(d.cpt); i<0?S.concepts.push(d.cpt):S.concepts.splice(i,1); render.keep=true; render(); return; }
  if (d.filter){ S.filter=d.filter; render.keep=true; render(); return; }
  if (d.like){ const p=S.posts.find(x=>x.id===d.like); p.liked=!p.liked; render.keep=true; render(); return; }
  if (d.report){ S.sheet=d.report; render.keep=true; render(); return; }
  if (d.reason){ const p=S.posts.find(x=>x.id===S.sheet); p.reported=true; S.sheet=null; render.keep=true; toast('신고했어요. 운영자가 확인해요.'); return; }
  if (d.nv){ S.noteView[d.nv]=d.v; render.keep=true; render(); return; }
  if (d.rewrite){ const n=S.notes[+d.rewrite]; S.rewriteI=+d.rewrite; S.ans=[...n.a]; S.mode='step'; S.concepts=[]; S.unitBack='notes'; go('write'); return; }
  if (d.atab){ S.adminTab=d.atab; render(); return; }
  if (d.ad){ const r=S.admin.find(x=>x.id===d.id); if(d.ad==='hide')r.hidden=true; if(d.ad==='show'){r.hidden=false;r.blocked=false;} if(d.ad==='block'){r.blocked=true;r.hidden=true;} render(); return; }
  if (d.star){ const p=S.posts.find(x=>x.id===d.star); p.rec=!p.rec; render(); return; }
  const act = d.act;
  if (!act) return;
  const A = {
    fillSignup(){ S.nick='수학하는고양이'; S.pw='password12'; S.age=true; S.agree=true; render.keep=true; render(); },
    signup(){
      if (S.nick.trim().length<2) S.err='별명을 2자 이상 써 줘.';
      else if (bad(S.nick)) S.err='별명에 쓸 수 없는 표현이 있어요.';
      else if (S.pw.length<8 || !/[A-Za-z]/.test(S.pw) || !/\d/.test(S.pw)) S.err='비밀번호는 영문과 숫자를 섞어 8자 이상으로 정해 줘.';
      else if (!S.age) S.err='만 14세 이상만 가입할 수 있어요.';
      else if (!S.agree) S.err='개인정보 처리방침에 동의해 줘.';
      else return go('code');
      render.keep=true; render();
    },
    login(){ S.nick=S.nick||'수학하는고양이'; go('home'); },
    toastRecover(){ toast('복구 코드 + 별명으로 비밀번호를 다시 정해요'); },
    privacy(){ go('privacy'); },
    editProfile(){ S.editProfile=true; render(); },
    saveProfile(){ S.profileSet=true; S.editProfile=false; go('examples'); },
    thinkPrev(){ S.thinkI=Math.max(0,S.thinkI-1); render.keep=true; render(); },
    thinkNext(){ S.thinkI=Math.min(3,S.thinkI+1); render.keep=true; render(); },
    fill(){ S.mode='step'; S.ans=[...SAMPLE]; S.concepts=['식에 값 넣기']; render.keep=true; render(); },
    badFill(){ S.ans[0]=SAMPLE[0]+' 궁금하면 010-1234-5678로 연락해'; S.mode='step'; render.keep=true; render(); },
    save(){
      const text = myAnswers().join(' ');
      const why = bad(text); if (why){ S.err=why; render.keep=true; render(); return; }
      const a = myAnswers();
      if (S.rewriteI!=null){ S.notes[S.rewriteI].re = a; S.rewriteI=null; toast('다시 쓴 연결을 저장했어'); return go('notes'); }
      S.posts = S.posts.filter(p=>!p.mine);
      S.posts.unshift({id:'me',mine:true,tag:S.interests[0]||'관심사',a,free:S.mode==='free',gotLike:false});
      S.notes = S.notes.filter(n=>n.unit!=='다항식');
      S.notes.push({unit:'다항식',subject:'공통수학1',tag:S.interests[0]||'관심사',pre:S.pre,post:S.post,share:S.share,a:S.mode==='free'?[a[0],'',''].filter(Boolean):a,re:null,hidden:false});
      S.filter='전체'; go('gallery'); toast('저장했어! 이제 친구들의 연결을 볼 수 있어');
    },
    moreToast(){ toast('20개씩 더 불러와요'); },
    copied(){ toast('글을 복사했어'); },
    imgSaved(){ toast('카드 이미지를 저장했어'); },
    toastPw(){ toast('바꾸면 다른 기기의 로그인은 모두 끊겨요'); },
    logoutAsk(){ S.sheet='logout'; render.keep=true; render(); },
    logout(){ const v=S.view,m=S.map; fresh('new'); S.view=v; S.map=m; render(); toast('로그아웃했어'); },
    closeSheet(){ S.sheet=null; render.keep=true; render(); },
    delete(){ const v=S.view,m=S.map; fresh('new'); S.view=v; S.map=m; render(); toast('계정과 글을 모두 지웠어'); },
  };
  A[act] && A[act]();
});
document.addEventListener('input', e=>{
  const d = e.target.dataset;
  if (d.in){ S[d.in]=e.target.value; if(d.in==='delName'){ const b=document.querySelector('[data-act="delete"]'); if(b) b.disabled = S.delName!==(S.nick||'수학하는고양이'); } return; }
  if (d.ans!=null){ S.ans[+d.ans]=e.target.value; refreshNext(); return; }
  if ('free' in d){ S.free=e.target.value; refreshNext(); return; }
});
document.addEventListener('change', e=>{
  const d = e.target.dataset;
  if (d.chk){ S[d.chk]=e.target.checked; if(d.chk==='careerUnknown'){ render.keep=true; render(); } return; }
  if (d.nshare!=null){ S.notes[+d.nshare].share=e.target.checked; toast(e.target.checked?'다시 공유했어':'공유를 껐어'); return; }
});
function refreshNext(){ const b=document.querySelector('[data-go="save"]'); if(b) b.disabled=!myAnswers().join('').trim(); }
render();
</script>
</body>
</html>
